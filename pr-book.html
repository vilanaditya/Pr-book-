<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>PR BOOK – P.R. Public School</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{--bg:#f4f7fc;--card:#fff;--tx:#14213d;--mu:#5b6b85;--pr:#1553b8;--ac:#f5b400;--ok:#1a9d57;--er:#d93025;--bd:#dde5f1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1626;--card:#16223a;--tx:#eaf0fb;--mu:#9fb0cc;--bd:#2a3a59}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx)}
header{background:var(--pr);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header b{font-size:20px}header b i{color:var(--ac);font-style:normal}header small{opacity:.85;font-size:11px;display:block}
nav{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}nav button{background:none;border:0;color:#fff;padding:8px;font-size:13px;border-radius:8px;cursor:pointer}nav button.on{background:#ffffff30}
main{max-width:980px;margin:0 auto;padding:14px 14px 90px}
.notice{background:#fff4cc;color:#6b4e00;padding:8px 14px;font-size:13px;text-align:center}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px #0001}
.hero{background:linear-gradient(135deg,#1553b8,#0b2f6e);color:#fff;border-radius:18px;padding:24px 18px}.hero h1{margin:0 0 8px;font-size:26px}
.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:700;font-size:14px;cursor:pointer;background:var(--pr);color:#fff;min-height:44px}
.btn.y{background:var(--ac);color:#222}.btn.g{background:#1faa59}.btn.o{background:none;border:2px solid var(--pr);color:var(--pr)}.btn.s{padding:6px 10px;min-height:32px;font-size:12px}.btn:disabled{opacity:.45}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.cls{text-align:center;padding:18px 6px;font-weight:700;cursor:pointer;border:1px solid var(--bd);border-radius:12px;background:var(--card)}.cls:hover{background:var(--pr);color:#fff}
.bk .img{height:90px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:34px;color:#fff;margin-bottom:8px}
.tag{font-size:11px;background:#e3edff;color:var(--pr);padding:2px 7px;border-radius:6px}.in{color:var(--ok);font-size:12px}.out{color:var(--er);font-size:12px;font-weight:700}
.qty{display:flex;align-items:center;gap:8px;margin:8px 0}.qty button{width:34px;height:34px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:18px}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;font-size:15px;background:var(--card);color:var(--tx);margin:4px 0 10px}label{font-size:13px;color:var(--mu)}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}.sp{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--ac);color:#222;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;font-weight:700;z-index:6;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:7px 5px;border-bottom:1px solid var(--bd);text-align:left}.scroll{overflow-x:auto}
.st{padding:2px 8px;border-radius:8px;font-size:12px;background:#e3edff}.step{display:flex;gap:6px;font-size:12px;margin-bottom:10px;flex-wrap:wrap}.step span{padding:4px 9px;border-radius:12px;background:var(--card);border:1px solid var(--bd)}.step .on{background:var(--pr);color:#fff}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.stat b{font-size:26px;display:block}
.tl div{padding:6px 0 6px 12px;border-left:3px solid var(--bd)}.tl .d{border-color:var(--ok);font-weight:700}
#modal{position:fixed;inset:0;background:#000a;display:none;z-index:20;overflow:auto;padding:14px}#modal.show{display:block}
#slip{background:#fff;color:#000;max-width:640px;margin:0 auto 12px;padding:18px;border:1px solid #000;font-size:13px}#slip.compact{max-width:300px;font-size:11px;padding:8px}
#slip table th,#slip table td{border:1px solid #444;padding:4px}#slip h2,#slip h3{margin:2px;text-align:center}
@media print{body *{visibility:hidden}#slip,#slip *{visibility:visible}#slip{position:absolute;left:0;top:0;border:0;margin:0;max-width:none}#slip.compact{max-width:80mm}#modal{background:none;padding:0;overflow:visible}header,.bar,.noprint{display:none!important}}
</style></head><body>
<header><div style="font-size:26px">📖</div><div><b>PR <i>BOOK</i></b><small>P.R. PUBLIC SCHOOL, PINDOHARI-MAU</small></div><nav id="nav"></nav></header>
<div id="nt"></div><main id="app"></main><div id="bar"></div><div id="modal"></div>
<script>
const K='prbook_v1',$=s=>document.querySelector(s),R=n=>'₹'+n.toLocaleString('en-IN');
const CL=['Nursery','LKG','UKG',...Array.from({length:10},(_,i)=>'Class '+(i+1))];
const TY=[['Mathematics Book','Mathematics','Textbook',1.0,'#e8590c'],['English Book','English','Textbook',.9,'#1971c2'],['Hindi Book','Hindi','Textbook',.8,'#2f9e44'],['Science Book','Science','Textbook',1.1,'#7048e8'],['Social Science Book','Social Science','Textbook',.95,'#c2255c'],['Notebook (Single Line)','General','Notebook',.2,'#0b7285'],['Practical Copy','Science','Practical Copy',.25,'#f08c00'],['Drawing Book','Art','Drawing Book',.3,'#d6336c']];
function seed(){const b=[];CL.forEach((c,ci)=>TY.forEach((t,ti)=>{if(ci<3&&ti>=3&&ti<5)return;b.push({id:'b'+ci+'_'+ti,cls:ci,name:t[0],subject:t[1],cat:t[2],pub:'Demo Publisher',price:Math.round((150+ci*10)*t[3]/5)*5||50,stock:(ci*7+ti*13)%17==0?0:(ci*5+ti*11)%9==0?4:40,color:t[4],on:1})}));
return{books:b,orders:[],seq:{},set:{wa:'919838542737',notice:'Book counter timing: 9:00 AM – 2:00 PM.',pickup:'Collect books from the school counter with your order slip.',adm:'admin123'}}}
let D=JSON.parse(localStorage.getItem(K)||'null')||seed();const save=()=>{try{localStorage.setItem(K,JSON.stringify(D))}catch(e){alert('Storage is full. Use smaller images or delete some pictures.')}};
let S={v:'home',cls:null,cart:{},q:'',cat:'All',stu:{},last:null,admin:false,logged:false,tab:'dash',f:''};
const bk=id=>D.books.find(b=>b.id==id);
const stk=b=>b.stock<=0?'out':b.stock<=5?'lim':'in';
const items=()=>Object.entries(S.cart).filter(([,q])=>q>0).map(([id,q])=>({b:bk(id),q}));
const tot=()=>items().reduce((a,i)=>a+i.b.price*i.q,0),cnt=()=>items().reduce((a,i)=>a+i.q,0);
function add(id,q){const b=bk(id);if(b.stock<=0)return toast('Out of stock');S.cart[id]=Math.min(b.stock,(S.cart[id]||0)+q);if(S.cart[id]<=0)delete S.cart[id];draw()}
function toast(m){alert(m)}
function go(v,x){S.v=v;Object.assign(S,x||{});draw();scrollTo(0,0)}
function oid(){const d=new Date(),k=d.toISOString().slice(0,10).replace(/-/g,'');D.seq[k]=(D.seq[k]||0)+1;return`PRB-${k}-${String(D.seq[k]).padStart(4,'0')}`}
// trusted order creation: price & stock are re-read from DB, never from UI
function createOrder(src,pay){const its=[];for(const[id,q]of Object.entries(S.cart)){const b=bk(id);if(!b||!b.on)return toast('An item is no longer available.');if(b.stock<q)return toast(b.name+': only '+b.stock+' in stock.');its.push({productId:id,productName:b.name,quantity:q,priceAtOrderTime:b.price,total:b.price*q})}
if(!its.length)return toast('Your cart is empty.');its.forEach(i=>bk(i.productId).stock-=i.quantity);
const o={orderNumber:oid(),...S.stu,className:CL[S.cls],items:its,totalItems:its.reduce((a,i)=>a+i.quantity,0),totalAmount:its.reduce((a,i)=>a+i.total,0),paymentStatus:pay?.s||'Pending',paymentMethod:pay?.m||'—',orderStatus:'New',orderSource:src,createdAt:new Date().toISOString()};
D.orders.unshift(o);save();S.cart={};S.last=o;return o}
function waMsg(o){return`PR BOOK — BOOK ORDER\nP.R. PUBLIC SCHOOL, PINDOHARI-MAU\n\nOrder ID: ${o.orderNumber}\n\nStudent Name: ${o.studentName}\nClass: ${o.className}\nSection: ${o.section||'-'}\nParent Mobile: ${o.parentMobile}\n\nORDER ITEMS:\n${o.items.map((i,n)=>`${n+1}. ${i.productName} × ${i.quantity} — ${R(i.total)}`).join('\n')}\n\nTotal Items: ${o.totalItems}\n\nTOTAL AMOUNT: ${R(o.totalAmount)}\n\nPlease confirm the availability of this order.`}
const waUrl=(num,o)=>`https://wa.me/${num}?text=${encodeURIComponent(waMsg(o))}`;const wa=(num,o)=>{let w=null;try{w=window.open(waUrl(num,o),'_blank')}catch(e){}if(!w)navigator.clipboard?.writeText(waMsg(o)).catch(()=>{});return w};
function nav(){const a=S.admin;$('#nav').innerHTML=(a?[['dash','Dashboard'],['new','New Order'],['orders','Orders'],['bks','Books'],['inv','Inventory'],['sett','Settings']].map(([k,l])=>`<button class="${S.tab==k?'on':''}" onclick="S.tab='${k}';S.v='adm';S.cart={};S.cls=null;draw()">${l}</button>`).join('')+`<button onclick="S.admin=false;S.logged=false;go('home')">Exit</button>`:[['home','Home'],['books','Books'],['track','Track'],['cart','Cart 🛒'+(cnt()||'')],['help','Help']].map(([k,l])=>`<button class="${S.v==k?'on':''}" onclick="${k=='books'?"go('classes')":k=='help'?"window.open('https://wa.me/'+D.set.wa)":`go('${k}')`}">${l}</button>`).join('')+`<button onclick="go('login',{admin:true})">Admin</button>`);
$('#nt').innerHTML=!a&&D.set.notice?`<div class="notice">📢 ${D.set.notice}</div>`:''}
function bar(){$('#bar').innerHTML=cnt()&&!['cart','details','confirm','success','login'].includes(S.v)?`<div class="bar"><span>🛒 ${cnt()} Items • ${R(tot())}</span><button class="btn" onclick="go('cart')">VIEW CART →</button></div>`:''}
function classes(){return`<h2>Select Class</h2><p style="color:var(--mu)">Choose the student's class to view books and copies.</p><div class="grid">${CL.map((c,i)=>`<div class="cls" onclick="go('${S.admin?'abooks':'books'}',{cls:${i},q:'',cat:'All'})">${c}</div>`).join('')}</div>`}
function step(n){return`<div class="step">${['Select Class','Choose Books','Student Details','Confirm Order'].map((t,i)=>`<span class="${i+1==n?'on':''}">${i+1} ${t}</span>`).join('')}</div>`}
function books(){const ad=S.admin;let L=D.books.filter(b=>b.cls==S.cls&&b.on);const cats=['All',...new Set(L.map(b=>b.cat))];if(S.cat!='All')L=L.filter(b=>b.cat==S.cat);if(S.q)L=L.filter(b=>(b.name+b.subject+b.cat).toLowerCase().includes(S.q.toLowerCase()));
const core=D.books.filter(b=>b.cls==S.cls&&b.on&&b.stock>0),sp=core.reduce((a,b)=>a+b.price,0),setP=Math.round(sp*.95/10)*10;
return(ad?step(2):'')+`<div class="sp"><h2>${CL[S.cls]} — Books & Copies</h2><button class="btn s o" onclick="go('${ad?'new':'classes'}')">Change class</button></div>
<div class="card sp"><div><b>Complete Book Set</b><br><small>${core.length} items • <b>${R(setP)}</b> (save ${R(sp-setP)})</small></div><button class="btn y" onclick="core.length&&(S.cart={},${JSON.stringify(core.map(b=>b.id))}.forEach(i=>S.cart[i]=1),S.setP=${setP},draw())">BUY COMPLETE SET</button></div>
<input placeholder="🔍 Search books, subject, category" value="${S.q}" oninput="S.q=this.value;draw(1)" id="sq"><div class="row" style="margin-bottom:10px">${cats.map(c=>`<button class="btn s ${S.cat==c?'':'o'}" style="flex:none" onclick="S.cat='${c}';draw()">${c}</button>`).join('')}</div>
${L.length?'':'<div class="card">No items found.</div>'}<div class="grid">${L.map(b=>{const q=S.cart[b.id]||0,s=stk(b);return`<div class="card bk">${im(b)}<b>${b.name}</b><br><span class="tag">${b.cat}</span> <small>${b.subject}</small><div class="sp"><b>${R(b.price)}</b><span class="${s=='out'?'out':'in'}">${s=='out'?'OUT OF STOCK':s=='lim'?'Limited Stock':'● In Stock'}</span></div>
<div class="qty"><button aria-label="less" onclick="add('${b.id}',-1)">−</button><b>${q||1}</b><button aria-label="more" onclick="add('${b.id}',1)">+</button></div><button class="btn" style="width:100%" ${s=='out'?'disabled':''} onclick="add('${b.id}',${q?0:1})">${q?'✓ In cart ('+q+')':'Add to Cart'}</button></div>`}).join('')}</div>${ad&&cnt()?`<div class="bar"><span>${cnt()} items • ${R(tot())}</span><button class="btn" onclick="go('details')">Next → Student Details</button></div>`:''}`}
function cart(){const L=items();if(!L.length)return`<div class="card"><h3>Your cart is empty</h3><button class="btn" onclick="go('classes')">Browse books</button></div>`;
return`<h2>Your Cart</h2>${L.map(({b,q})=>`<div class="card sp"><div><b>${b.name}</b><br><small>${R(b.price)} each</small><div class="qty"><button onclick="add('${b.id}',-1)">−</button><b>${q}</b><button onclick="add('${b.id}',1)">+</button> <button onclick="delete S.cart['${b.id}'];draw()">🗑</button></div></div><b>${R(b.price*q)}</b></div>`).join('')}
<div class="card sp"><span>Total Items: <b>${cnt()}</b></span><b style="font-size:22px">TOTAL: ${R(tot())}</b></div><div class="row"><button class="btn o" onclick="go(S.cls==null?'classes':S.admin?'abooks':'books')">CONTINUE SHOPPING</button><button class="btn" onclick="go('details')">PROCEED TO ORDER</button></div>`}
function details(){const s=S.stu,ad=S.admin;if(!cnt())return cart();return(ad?step(3):'')+`<h2>Student Details</h2><div class="card"><label>Student Name *</label><input id="n" value="${s.studentName||''}"><label>Class</label><input value="${CL[S.cls]??'—'}" disabled><div class="row"><div><label>Section</label><input id="sec" value="${s.section||''}"></div><div><label>Roll Number</label><input id="rl" value="${s.rollNumber||''}"></div></div><label>Parent Mobile Number *</label><input id="m" inputmode="numeric" maxlength="10" value="${s.parentMobile||''}"><label>Father's / Mother's Name</label><input id="pn" value="${s.parentName||''}">
${ad?`<div class="row"><div><label>Payment Status</label><select id="ps"><option>Pending<option>Paid<option>Partially Paid</select></div><div><label>Payment Method</label><select id="pm"><option>Cash<option>UPI<option>Other</select></div></div>`:''}
<div class="row"><button class="btn o" onclick="go('cart')">Back</button><button class="btn" onclick="sd()">Continue →</button></div></div>`}
function sd(){const v=i=>$('#'+i)?.value.trim();if(!v('n'))return toast('Please enter the student name.');if(!/^[6-9]\d{9}$/.test(v('m')))return toast('Please enter a valid 10-digit mobile number.');
S.stu={studentName:v('n'),section:v('sec'),rollNumber:v('rl'),parentMobile:v('m'),parentName:v('pn')};if(S.admin)S.pay={s:v('ps'),m:v('pm')};go('confirm')}
function confirm_(){const L=items();return(S.admin?step(4):'')+`<h2>Check Your Order</h2><div class="card"><b>${S.stu.studentName}</b> • ${CL[S.cls]} ${S.stu.section||''}<br>Parent mobile: ${S.stu.parentMobile}</div><div class="card">${L.map(({b,q})=>`<div class="sp"><span>${b.name} × ${q}</span><b>${R(b.price*q)}</b></div>`).join('')}<hr><div class="sp"><span>Total Items ${cnt()}</span><b style="font-size:22px">${R(tot())}</b></div></div><div class="row"><button class="btn o" onclick="go('details')">EDIT ORDER</button><button class="btn g" onclick="place()">${S.admin?'Create Order & Print Slip':'SEND ORDER ON WHATSAPP'}</button></div>`}
function place(){const o=createOrder(S.admin?'ADMIN_COUNTER':'CUSTOMER_WHATSAPP',S.admin?S.pay:null);if(!o)return;if(S.admin){S.tab='orders';S.v='adm';draw();slip(o.orderNumber)}else{go('success');wa(D.set.wa,o)}}
function success(){const o=S.last;return`<div class="card" style="text-align:center"><div style="font-size:50px">✅</div><h2>Order Successfully Created</h2><p>Order ID</p><h2 style="color:var(--pr)">${o.orderNumber}</h2><a class="btn g" style="display:block;text-decoration:none;line-height:20px" href="${waUrl(D.set.wa,o)}" target="_blank" rel="noopener">SEND ORDER ON WHATSAPP</a><p><small>If WhatsApp doesn't open, tap below to copy the order message and paste it in WhatsApp to +91 ${D.set.wa.slice(2,7)} ${D.set.wa.slice(7)}.</small></p><button class="btn o" onclick='navigator.clipboard.writeText(waMsg(S.last)).then(()=>toast("Order message copied"),()=>toast("Please copy manually"))'>COPY ORDER MESSAGE</button><div class="row" style="margin-top:10px"><button class="btn o" onclick="navigator.clipboard?.writeText('${o.orderNumber}');toast('Order ID copied')">SAVE ORDER ID</button><button class="btn o" onclick="go('track',{tq:'${o.orderNumber}'})">TRACK ORDER</button><button class="btn" onclick="go('home')">BACK TO HOME</button></div></div><div class="card"><b>What happens next?</b><ol><li>School receives your order.<li>Staff prepares your books.<li>${D.set.pickup}</ol></div>`}
const SS=['New','Confirmed','Preparing','Ready for Pickup','Completed','Cancelled'];
function track(){const o=D.orders.find(o=>o.orderNumber==(S.tq||'').trim().toUpperCase());return`<h2>Track Your Order</h2><div class="card"><input id="tq" placeholder="PRB-20261004-0012" value="${S.tq||''}"><button class="btn" style="width:100%" onclick="S.tq=$('#tq').value;draw()">TRACK ORDER</button></div>${S.tq?o?`<div class="card"><b>${o.orderNumber}</b><br>Class: ${o.className}<br>Date: ${new Date(o.createdAt).toLocaleString('en-IN')}<br>Total: ${R(o.totalAmount)}<div class="tl">${SS.slice(0,5).map((s,i)=>`<div class="${i<=SS.indexOf(o.orderStatus)?'d':''}">${i<=SS.indexOf(o.orderStatus)?'✓':'○'} ${s}</div>`).join('')}</div>${o.orderStatus=='Cancelled'?'<b class="out">Order cancelled</b>':''}</div>`:'<div class="card">We couldn\'t find that Order ID. Please check and try again.</div>':''}`}
function home(){return`<div class="hero"><h1>PR <span style="color:var(--ac)">BOOK</span></h1><h2 style="margin:0 0 8px">Order Your School Books Without Waiting in Line</h2><p>Select your class, choose your books and copies, and send your complete order directly to our WhatsApp.</p><div class="row"><button class="btn y" onclick="go('classes')">ORDER BOOKS</button><button class="btn" style="background:#fff;color:var(--pr)" onclick="go('classes')">VIEW BOOK LIST</button></div></div><h3>How it works</h3><div class="grid">${['Select Class','Select Books','Review Cart','Send on WhatsApp','Collect'].map((t,i)=>`<div class="card"><b style="color:var(--pr)">0${i+1}</b><br>${t}</div>`).join('')}</div><h3>Why PR BOOK?</h3><div class="grid">${['⏱ Save Time','👥 No Long Queue','✔ Easy Ordering','📘 Official Book List','₹ Transparent Prices'].map(t=>`<div class="card">${t}</div>`).join('')}</div>`}
// ADMIN
const im=b=>b.img?`<img src="${b.img}" loading="lazy" alt="${b.name}" style="width:100%;height:90px;object-fit:cover;border-radius:10px;margin-bottom:8px">`:`<div class="img" style="background:${b.color}">📘</div>`;
let F={};
function bks(){const L=D.books.filter(b=>(S.bc==null||S.bc===''||b.cls==S.bc)&&(!S.bq||(b.name+b.subject).toLowerCase().includes(S.bq.toLowerCase())));
return`<div class="sp"><h2>Books</h2><button class="btn y" onclick="bform()">+ ADD NEW BOOK</button></div><div class="row"><select onchange="S.bc=this.value;draw()"><option value="">All classes${CL.map((c,i)=>`<option value="${i}" ${S.bc==i&&S.bc!==''?'selected':''}>${c}`).join('')}</select><input id="bq" placeholder="Search books" value="${S.bq||''}" oninput="S.bq=this.value;draw(3)"></div>
${L.slice(0,60).map(b=>`<div class="card sp" style="${b.on?'':'opacity:.6'}"><div style="display:flex;gap:10px;align-items:center">${b.img?`<img src="${b.img}" style="width:48px;height:48px;object-fit:cover;border-radius:8px">`:`<div style="width:48px;height:48px;border-radius:8px;background:${b.color};color:#fff;display:flex;align-items:center;justify-content:center">📘</div>`}<div><b>${b.name}</b>${b.on?'':' <span class="st">Archived</span>'}<br><small>${CL[b.cls]} • ${b.cat} • ${R(b.price)} • Stock ${b.stock}</small></div></div><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn s" onclick="bform('${b.id}')">Edit</button>${b.on?`<button class="btn s" style="background:var(--er)" onclick="delBook('${b.id}')">Delete</button>`:`<button class="btn s g" onclick="bk('${b.id}').on=1;save();draw()">Restore</button>`}</div></div>`).join('')}${L.length>60?`<p>Showing first 60 of ${L.length}. Use search or class filter.</p>`:''}`}
function bform(id){const b=id?bk(id):{cls:0,price:'',stock:'',cat:'Textbook'};F={img:b.img||''};const cats=[...new Set(D.books.map(x=>x.cat))];
$('#modal').innerHTML=`<div class="card" style="max-width:560px;margin:0 auto"><h3>${id?'Edit Book':'Add New Book'}</h3><label>Book name *</label><input id="fn" value="${b.name||''}"><div class="row"><div><label>Class</label><select id="fc">${CL.map((c,i)=>`<option value="${i}" ${b.cls==i?'selected':''}>${c}`).join('')}</select></div><div><label>Category</label><input id="fk" list="cl" value="${b.cat||''}"><datalist id="cl">${cats.map(c=>`<option>${c}`).join('')}</datalist></div></div><div class="row"><div><label>Subject</label><input id="fs" value="${b.subject||''}"></div><div><label>Publisher</label><input id="fp" value="${b.pub||''}"></div></div><label>Description</label><textarea id="fd">${b.desc||''}</textarea><div class="row"><div><label>Price (₹) *</label><input id="fpr" type="number" min="0" value="${b.price}"></div><div><label>Stock *</label><input id="fst" type="number" min="0" value="${b.stock}"></div></div>
<label>Picture</label><input type="file" accept="image/*" onchange="pick(this)"><div id="pv">${F.img?`<img src="${F.img}" style="max-width:140px;border-radius:10px">`:''}</div><button class="btn s o" onclick="F.img='';$('#pv').innerHTML=''">Remove picture</button>
<div class="row" style="margin-top:12px"><button class="btn o" onclick="$('#modal').classList.remove('show')">CANCEL</button><button class="btn" onclick="sbk('${id||''}')">SAVE BOOK</button></div></div>`;$('#modal').classList.add('show')}
function pick(i){const f=i.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const m=480,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);F.img=c.toDataURL('image/jpeg',.7);$('#pv').innerHTML=`<img src="${F.img}" style="max-width:140px;border-radius:10px">`};im.onerror=()=>toast('Could not read this image. Please try another.');im.src=rd.result};rd.readAsDataURL(f)}
function sbk(id){const v=i=>$('#'+i).value.trim(),n=v('fn'),p=+v('fpr'),st=+v('fst');if(!n)return toast('Please enter the book name.');if(!(p>0))return toast('Please enter a valid price.');if(!(st>=0)||v('fst')==='')return toast('Please enter the stock.');
const d={name:n,cls:+$('#fc').value,cat:v('fk')||'Other',subject:v('fs'),pub:v('fp'),desc:v('fd'),price:p,stock:Math.floor(st),img:F.img};
if(id)Object.assign(bk(id),d);else D.books.unshift({id:'b'+Date.now(),color:'#1553b8',on:1,...d});save();$('#modal').classList.remove('show');draw()}
function delBook(id){const b=bk(id),used=D.orders.some(o=>o.items.some(i=>i.productId==id));
if(used){if(confirm(`"${b.name}" is in old orders, so it will be archived (hidden from customers) to keep order history safe. Continue?`)){b.on=0;delete S.cart[id];save();draw()}}
else if(confirm(`Permanently delete "${b.name}"?`)){D.books=D.books.filter(x=>x.id!=id);delete S.cart[id];save();draw()}}
function login(){return`<div class="card" style="max-width:380px;margin:30px auto"><h2>Admin Login</h2><label>Password</label><input id="pw" type="password"><button class="btn" style="width:100%" onclick="if($('#pw').value==D.set.adm){S.logged=true;S.admin=true;S.tab='dash';go('adm')}else toast('Incorrect password.')">Login</button><small style="color:var(--mu)">Prototype login (demo password: admin123). Production version uses Firebase Authentication.</small></div>`}
function adm(){if(!S.logged)return login();const t=S.tab,O=D.orders,td=new Date().toISOString().slice(0,10);
if(t=='dash')return`<h2>Dashboard</h2><div class="stat">${[['Total Orders',O.length],['Total Books',D.books.filter(b=>b.on).length],['Classes',CL.length],['New Orders',O.filter(o=>o.orderStatus=='New').length],['Ready for Pickup',O.filter(o=>o.orderStatus=='Ready for Pickup').length],['Out of Stock',D.books.filter(b=>b.stock<=0).length],['Today\'s Value',R(O.filter(o=>o.createdAt.startsWith(td)).reduce((a,o)=>a+o.totalAmount,0))]].map(([l,v])=>`<div class="card"><small>${l}</small><b>${v}</b></div>`).join('')}</div><div class="card" style="border:2px solid var(--ac)"><h3>+ CREATE NEW ORDER</h3><p>Create an order for a student at the counter</p><button class="btn" onclick="S.tab='new';draw()">+ CREATE NEW ORDER</button></div><div class="card"><h3>Books</h3><div class="row"><button class="btn y" onclick="bform()">+ ADD NEW BOOK</button><button class="btn o" onclick="S.tab='bks';draw()">MANAGE / DELETE BOOKS</button></div></div>${rep()}`;
if(t=='new')return S.cls==null?step(1)+classes():'';
if(t=='orders')return ords();if(t=='bks')return bks();if(t=='inv')return inv();return sett()}
function rep(){const O=D.orders,sum=f=>O.filter(f).reduce((a,o)=>a+o.totalAmount,0),m={};O.forEach(o=>o.items.forEach(i=>m[i.productName]=(m[i.productName]||0)+i.quantity));const top=Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,5);
return`<div class="card"><h3>Reports</h3>Customer orders: <b>${O.filter(o=>o.orderSource=='CUSTOMER_WHATSAPP').length}</b> • Counter orders: <b>${O.filter(o=>o.orderSource=='ADMIN_COUNTER').length}</b><br>Total value: <b>${R(sum(()=>1))}</b> • Paid: <b>${R(sum(o=>o.paymentStatus=='Paid'))}</b> • Pending: <b>${R(sum(o=>o.paymentStatus!='Paid'))}</b><br>Most ordered: ${top.map(([n,q])=>n+' ('+q+')').join(', ')||'—'}</div>`}
function ords(){let L=D.orders.filter(o=>!S.f||(o.orderNumber+o.studentName+o.parentMobile).toLowerCase().includes(S.f.toLowerCase()));
return`<h2>Orders</h2><input id="of" placeholder="Search Order ID, student, mobile" value="${S.f}" oninput="S.f=this.value;draw(2)">${L.length?'':'<div class="card">No orders yet.</div>'}<div class="scroll"><table>${L.length?'<tr><th>Order<th>Student<th>Class<th>Source<th>Total<th>Payment<th>Status<th>':''}${L.map(o=>`<tr><td>${o.orderNumber}<td>${o.studentName}<td>${o.className}<td>${o.orderSource=='ADMIN_COUNTER'?'Counter':'WhatsApp'}<td>${R(o.totalAmount)}<td><select onchange="up('${o.orderNumber}','paymentStatus',this.value)" style="margin:0">${['Pending','Paid','Partially Paid'].map(s=>`<option ${s==o.paymentStatus?'selected':''}>${s}`).join('')}</select><td><select onchange="up('${o.orderNumber}','orderStatus',this.value)" style="margin:0">${SS.map(s=>`<option ${s==o.orderStatus?'selected':''}>${s}`).join('')}</select><td><button class="btn s" onclick="slip('${o.orderNumber}')">🖨 Slip</button> <button class="btn s g" onclick="wa2('${o.orderNumber}')">WhatsApp</button>`).join('')}</table></div>`}
function up(id,k,v){const o=D.orders.find(o=>o.orderNumber==id);o[k]=v;if(k=='orderStatus'&&v=='Cancelled'&&!o.restocked){o.items.forEach(i=>{const b=bk(i.productId);if(b)b.stock+=i.quantity});o.restocked=1}save();draw()}
function wa2(id){const o=D.orders.find(o=>o.orderNumber==id);window.open(`https://wa.me/91${o.parentMobile}?text=${encodeURIComponent(`PR BOOK — P.R. Public School\nOrder ${o.orderNumber} for ${o.studentName} (${o.className}) is now: ${o.orderStatus}.\nTotal: ${R(o.totalAmount)}. Payment: ${o.paymentStatus}.\n${D.set.pickup}`)}`,'_blank')}
function inv(){return`<div class="sp"><h2>Inventory</h2><button class="btn y" onclick="bform()">+ ADD NEW BOOK</button></div><div class="scroll"><table><tr><th>Product<th>Class<th>Price<th>Stock<th>Status<th>${D.books.map(b=>`<tr><td>${b.name}<td>${CL[b.cls]}<td><input type="number" value="${b.price}" style="width:80px;margin:0" onchange="bk('${b.id}').price=+this.value;save()"><td><input type="number" value="${b.stock}" style="width:70px;margin:0" onchange="bk('${b.id}').stock=Math.max(0,+this.value);save();draw()"><td class="${stk(b)=='out'?'out':'in'}">${{in:'In Stock',lim:'Limited',out:'Out of Stock'}[stk(b)]}<td><button class="btn s" onclick="bform('${b.id}')">Edit</button> <button class="btn s" style="background:var(--er)" onclick="delBook('${b.id}')">Delete</button>`).join('')}</table></div>`}
function sett(){return`<h2>Settings</h2><div class="card"><label>School WhatsApp number (with 91)</label><input id="s1" value="${D.set.wa}"><label>Notice banner (blank = hidden)</label><input id="s2" value="${D.set.notice}"><label>Pickup instructions</label><textarea id="s3">${D.set.pickup}</textarea><button class="btn" onclick="D.set.wa=$('#s1').value.replace(/\\D/g,'');D.set.notice=$('#s2').value;D.set.pickup=$('#s3').value;save();toast('Saved');draw()">Save</button> <button class="btn o" onclick="if(confirm('Reset all demo data?')){D=seed();save();draw()}">Reset demo data</button></div>`}
function slip(id){const o=D.orders.find(o=>o.orderNumber==id),q=qrcode(0,'M');q.addData(o.orderNumber);q.make();const d=new Date(o.createdAt);
$('#modal').innerHTML=`<div class="noprint" style="max-width:640px;margin:0 auto 10px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="window.print()">PRINT</button><button class="btn o" style="background:#fff" onclick="window.print()">SAVE AS PDF</button><button class="btn y" onclick="$('#slip').classList.remove('compact')">A4 PRINT</button><button class="btn y" onclick="$('#slip').classList.add('compact')">COMPACT RECEIPT</button><button class="btn" style="background:#555" onclick="$('#modal').classList.remove('show')">Close</button></div>
<div id="slip"><h2>P.R. PUBLIC SCHOOL</h2><h3>PINDOHARI-MAU</h3><h2>📖 PR BOOK</h2><h3>BOOK ORDER SLIP</h3><p><b>Order ID:</b> ${o.orderNumber}<br><b>Date:</b> ${d.toLocaleDateString('en-IN')} <b>Time:</b> ${d.toLocaleTimeString('en-IN')}<br><b>Student:</b> ${o.studentName} • <b>Class:</b> ${o.className} ${o.section||''} • <b>Roll:</b> ${o.rollNumber||'-'}<br><b>Parent:</b> ${o.parentName||'-'} • ${o.parentMobile}<br><b>Source:</b> ${o.orderSource} • <b>Payment:</b> ${o.paymentStatus} (${o.paymentMethod})</p>
<table><tr><th>S.No.<th>Item<th>Qty<th>Price<th>Total${o.items.map((i,n)=>`<tr><td>${n+1}<td>${i.productName}<td>${i.quantity}<td>${R(i.priceAtOrderTime)}<td>${R(i.total)}`).join('')}</table>
<div class="sp"><div><p>Total Items: <b>${o.totalItems}</b><br><b style="font-size:16px">TOTAL AMOUNT: ${R(o.totalAmount)}</b><br>Payment: <b>${o.paymentStatus.toUpperCase()}</b><br>Order: <b>${o.orderStatus.toUpperCase()}</b></p></div><div style="width:90px">${q.createSvgTag(3)}</div></div><p style="text-align:center"><b>Thank you!</b><br>Please bring this slip while collecting your books.</p></div>`;$('#modal').classList.add('show')}
function draw(f){const keep=f&&document.activeElement?.id,pos=keep&&document.activeElement.selectionStart;nav();bar();
const V={home,classes,books,abooks:books,cart,details,confirm:confirm_,success,track,login,adm,help:home};let h=V[S.v]();
if(S.v=='adm'&&S.tab=='new'&&S.cls!=null){h=books()}$('#app').innerHTML=h;
if(keep){const e=document.getElementById(keep)||document.getElementById({sq:'sq',of:'of'}[keep]);if(e){e.focus();try{e.setSelectionRange(pos,pos)}catch(x){}}}}
// admin class pick inside "new order" → books
const _go=go;go=function(v,x){if(S.admin&&v=='abooks'){S.v='adm';S.tab='new';Object.assign(S,x);draw();return}if(S.admin&&v=='new'){S.cls=null;S.tab='new';S.v='adm';draw();return}_go(v,x)};
draw();
</script></body></html>
